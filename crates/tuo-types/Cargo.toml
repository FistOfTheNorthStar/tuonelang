[package]
name = "tuo-types"
description = "Type checking and inference for tuonelang."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
tuo-source.workspace = true
tuo-diagnostics.workspace = true
tuo-lexer.workspace = true
tuo-ast.workspace = true
tuo-resolve.workspace = true
# ADR-0020 Stage C: the constant-time gate walks raw CST nodes, so it needs
# the syntax kinds. tuo-syntax is layer 25 and tuo-types is layer 50, so this
# edge points downward, as the dependency policy requires.
tuo-syntax.workspace = true

[dev-dependencies]
tuo-parser.workspace = true
