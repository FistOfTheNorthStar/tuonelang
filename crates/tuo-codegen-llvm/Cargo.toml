[package]
name = "tuo-codegen-llvm"
description = "LLVM native backend for tuonelang (consumes MIR)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
tuo-source.workspace = true
tuo-diagnostics.workspace = true
tuo-mir.workspace = true
tuo-resolve.workspace = true
tuo-types.workspace = true
tuo-runtime.workspace = true
tuo-codegen.workspace = true

# The LLVM release backend. `inkwell` is the safe Rust wrapper; the `llvm19-1`
# feature pins the supported LLVM major to **19** (see the crate docs). LLVM is
# an external toolchain located at build time by `llvm-sys` (inkwell's `-sys`
# layer): it honours `LLVM_SYS_191_PREFIX`, otherwise searches `PATH` for
# `llvm-config`/`llvm-config-19`, and finally probes a Homebrew `llvm@19`. No
# inkwell or LLVM type is re-exported from this crate.
inkwell.workspace = true
