[package]
name = "tuo-cli"
description = "Command-line interface for the tuonelang compiler and tooling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The produced binary is named `tuo`, while the crate is `tuo-cli`.
[[bin]]
name = "tuo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
# The machine protocol builds its wire objects with serde_json, mirroring the
# hand-built, versioned JSON of tuo-diagnostics.
serde_json.workspace = true
# The CLI drives the compiler through the facade; tooling surfaces above the
# facade (like the formatter) are driven directly.
tuo-compiler.workspace = true
tuo-fmt.workspace = true
tuo-spec.workspace = true
# `tuo agent --stdio` hosts the agent protocol server; the CLI is its transport
# and supplies the canonical formatter (tuo-fmt sits at the agent's own layer,
# so the agent takes it through an injected seam) to the protocol core.
tuo-agent.workspace = true
# `tuo build` / `tuo run` drive the code generator: the backend-agnostic
# interface plus both backends behind it (Cranelift for the default debug build,
# LLVM for `--release`), and the runtime whose trap object is linked into the
# produced executable. Both backends stay behind the TDG-owned `CodegenBackend`
# interface; the CLI selects between them but never sees a Cranelift or LLVM type.
tuo-codegen.workspace = true
tuo-codegen-cranelift.workspace = true
tuo-codegen-llvm.workspace = true
tuo-runtime.workspace = true
# `tuo new/add/remove/check/build/verify/test` drive the package system: it
# models the manifest/lockfile and resolves a path-dependency graph off disk,
# and the CLI loads the resolved sources into the shared compiler pipeline.
tuo-package.workspace = true
# `tuo corpus validate` drives the compiler-validated corpus pipeline: the corpus
# crate runs the real stages (format → … → specs) and this CLI injects native
# execution (compile-link-run) through the corpus's `NativeExecutor` seam.
tuo-corpus.workspace = true
# `tuo bench report` re-scores a recorded code-generation benchmark by really
# compiling the model's outputs through the evaluation harness (which embeds no
# LLM); the CLI loads the run + pinned task set and renders the reports.
tuo-codegen-bench.workspace = true

[dev-dependencies]
# The end-to-end differential tests compute the reference result with the MIR
# interpreter and compare it against the native executable `tuo run` produces.
tuo-mir.workspace = true
tuo-mir-interp.workspace = true
# The ABI-equivalence tests assert the runtime ABI layouts (`tuo_runtime::abi`,
# over `tuo_types` types) agree with the interpreter's value model.
tuo-types.workspace = true
# The standard-library integration tests really compile every stdlib module and
# run every spec; the hallucination benchmark compiles real vs. invented APIs.
# (tuo-spec and tuo-compiler are already normal dependencies above.)
tuo-stdlib.workspace = true
# The performance-laboratory seam test injects the CLI's real native
# compile-link-run and a live `cc` as the lab's NativeRunner/ComparisonRunner,
# proving the supported workloads run natively and agree with C. tuo-bench is
# layer 110 < tuo-cli's 120, so this dev-dependency is a valid lower-layer edge.
tuo-bench.workspace = true
