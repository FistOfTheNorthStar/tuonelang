name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deny warnings across the whole build, matching local expectations.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / check / test / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the stable channel and the rustfmt + clippy
      # components. rustup honors that file automatically, so we only need to
      # ensure the pinned toolchain is installed. Each component needs its own
      # --component flag (a bare word after the flag is parsed as a toolchain
      # name, not a component).
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
