name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deny warnings across the whole build, matching local expectations.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / check / test / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The LLVM release backend (`tuo-codegen-llvm`) links against LLVM 21
      # through inkwell/`llvm-sys` (pinned by the `llvm21-1` feature), and the
      # three-way differential gate compiles programs with it. Ubuntu's own
      # archive does not carry LLVM 21, so add the apt.llvm.org repository
      # (`llvm.sh` registers it and its signing key), install the development
      # libraries, and point `llvm-sys` at their prefix. This value is set in
      # the process environment, so it overrides the Homebrew default in
      # `.cargo/config.toml` (which targets a local macOS dev box). Bumping the
      # pinned LLVM major means changing this version and the inkwell feature
      # together, in one commit.
      - name: Install LLVM 21
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev
          echo "LLVM_SYS_211_PREFIX=$(llvm-config-21 --prefix)" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the stable channel and the rustfmt + clippy
      # components. rustup honors that file automatically, so we only need to
      # ensure the pinned toolchain is installed. Each component needs its own
      # --component flag (a bare word after the flag is parsed as a toolchain
      # name, not a component).
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      # The Computer Language Benchmarks Game speed table: each workload built
      # by `tuo build --release` and by the C, Rust, and Go peers, timed, and
      # reported as a ratio to C. It fails only if a program computes the
      # wrong answer — shared runners are too noisy for a timing gate — so its
      # job is to put the current numbers in the log of every run.
      - name: Benchmarks Game speed table
        run: cargo test -p tuo-cli --test lab_command benchmarks_game_speed_table -- --ignored --nocapture

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
