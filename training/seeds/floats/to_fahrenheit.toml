task = """
Write `to_fahrenheit(take celsius: Float) -> Float` converting a \
temperature from degrees Celsius to degrees Fahrenheit (F = C * 9/5 + 32)."""
notes = """
Float literals always have digits on both sides of the point (`9.0`, not \
`9.`), and there are no negative literals: minus forty is `0.0 - 40.0`. The \
spec inputs are chosen so every result is exactly representable, since \
float `==` is exact."""
tier = "executable"
difficulty = 1
