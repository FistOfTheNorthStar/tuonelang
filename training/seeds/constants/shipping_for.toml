task = """
A shop charges a flat 499 cents for shipping and ships free from 5000 \
cents up. Declare both amounts as named constants, then write \
`shipping_for(take order_cents: Int) -> Int` returning the shipping charge \
and `order_total(take order_cents: Int) -> Int` returning the order plus \
shipping. An order of exactly 5000 cents ships free."""
notes = """
A `const` needs its type written (`const FLAT_RATE_CENTS: Int = 499;`) and \
can be named anywhere, specs included. Testing at `FREE_SHIPPING_CENTS - 1` \
and at `FREE_SHIPPING_CENTS` pins the boundary to the constant itself, so \
changing the threshold cannot leave a stale number in the spec."""
tier = "executable"
difficulty = 1
