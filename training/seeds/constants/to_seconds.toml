task = """
Declare `SECONDS_PER_MINUTE`, `SECONDS_PER_HOUR`, and `SECONDS_PER_DAY` as \
`Int` constants and use them to write `to_seconds(take days: Int, take \
hours: Int, take minutes: Int, take seconds: Int) -> Int`, the total length \
of a duration in seconds, and `whole_hours(take seconds: Int) -> Int`, the \
number of complete hours in a non-negative number of seconds."""
notes = """
A constant can be computed from literals and other constants \
(`24 * SECONDS_PER_HOUR`); the compiler evaluates it once, so the \
derivation stays visible at no run-time cost. A function call is not a \
constant expression (T0028), and neither is a constant defined through \
itself. Integer `/` truncates, which is exactly \"complete hours\" for a \
non-negative count."""
tier = "executable"
difficulty = 1
