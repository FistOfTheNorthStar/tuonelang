task = """
Write a runnable program that checks what a `std::sync` channel promises. \
`main` creates a channel, sends the job ids 3, 1, 4, 1, 5 and closes it. It \
then verifies three things: sending the negative value -7 was refused (a \
non-zero result), sending after `close` was refused, and \
`in_order(take ch: Int) -> Int` — which drains the channel and returns the \
received ids as decimal digits, first received first (so 3,1,4 gives 314) \
— returns 31415, proving the channel is first-in first-out. It returns 31 \
when all three hold, and 1..3 for the failing check."""
notes = """
A channel carries only non-negative Ints, so -1 can mean \"closed and \
drained\" without ambiguity; `send` refuses a negative value and a send on a \
closed channel instead of silently dropping it. Always check `send`'s result."""
run_exit = 31
tier = "effect"
difficulty = 3
stdlib_deps = ["sync"]
